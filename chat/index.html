<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem('bc_theme');if(t){document.documentElement.setAttribute('data-theme',t);if(t==='custom'){var v=JSON.parse(localStorage.getItem('bc_custom_theme')||'null');if(v){var r=document.documentElement.style;function hx(h){h=h.replace('#','');return parseInt(h.substr(0,2),16)+' '+parseInt(h.substr(2,2),16)+' '+parseInt(h.substr(4,2),16);}if(v.ink)r.setProperty('--ink',v.ink);if(v.navy)r.setProperty('--navy',v.navy);if(v.navyLight)r.setProperty('--navy-light',v.navyLight);if(v.bone)r.setProperty('--bone',v.bone);if(v.ash)r.setProperty('--ash',v.ash);if(v.brass){r.setProperty('--brass',v.brass);r.setProperty('--brass-bright',v.brassBright||v.brass);r.setProperty('--brass-rgb',hx(v.brass));}if(v.shadow)r.setProperty('--shadow-rgb',hx(v.shadow));}}}if(localStorage.getItem('bc_reduce_motion')==='1')document.documentElement.classList.add('reduce-motion');}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Chat — BloxCore</title>
<meta name="robots" content="index, follow">
<meta name="description" content="Chat live with the BloxCore Blox Fruits community.">
<link rel="canonical" href="https://bloxcore.xyz/chat/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="BloxCore">
<meta property="og:title" content="Global Chat — BloxCore">
<meta property="og:description" content="Chat live with the BloxCore Blox Fruits community.">
<meta property="og:image" content="https://bloxcore.xyz/assets/logo.png">
<meta property="og:url" content="https://bloxcore.xyz/chat/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Global Chat — BloxCore">
<meta name="twitter:description" content="Chat live with the BloxCore Blox Fruits community.">
<meta name="twitter:image" content="https://bloxcore.xyz/assets/logo.png">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" type="image/png" href="/assets/logo.png">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="brand"><img src="/assets/logo.png" alt="BloxCore" class="brand-logo"><span class="brand-name">Blox<span>Core</span></span></a>
    <button class="nav-toggle" aria-label="Toggle menu">☰</button>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/chat/">Live Chat</a></li>
      <li><a href="/giveaways/">Giveaways</a></li>
      <li><a href="/challenges/">Challenges</a></li>
      <li><a href="/leaderboard/">Leaderboard</a></li>
      <li><a href="/crews/">Crews</a></li>
      <li id="nav-auth-slot"></li>
    </ul>
  </div>
</nav>

<section class="section" style="padding-bottom:24px;">
  <div class="container">
    <h1 style="font-size:1.6rem; margin-bottom:2px;">Global Chat</h1>
    <p class="muted" style="margin-top:0;">One crew, one channel. Be decent to each other.</p>

    <div class="panel panel-plain" style="padding:0; display:flex; flex-direction:column; height:60vh; min-height:420px;">
      <div id="chat-messages" style="flex:1; overflow-y:auto; padding:16px 18px;">
        <div class="skeleton" style="height:40px; margin-bottom:12px;"></div>
        <div class="skeleton" style="height:40px; margin-bottom:12px;"></div>
        <div class="skeleton" style="height:40px;"></div>
      </div>

      <div id="chat-compose" style="border-top:1px solid var(--navy-light); padding:14px 18px;">
        <form id="chat-form" style="display:flex; gap:10px; align-items:flex-end;">
          <input type="text" id="chat-input" placeholder="Say something…" maxlength="500" style="margin:0; flex:1;" autocomplete="off">
          <button type="submit" class="btn btn-primary" id="chat-send-btn">Send</button>
        </form>
      </div>

      <div id="chat-signed-out" style="display:none; border-top:1px solid var(--navy-light); padding:18px; text-align:center;">
        <a href="/auth/" class="btn btn-primary btn-sm">Sign in to chat</a>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">BloxCore is an unofficial fan-made community project for Blox Fruits players.</div>
</footer>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/chat.js"></script>
</body>
</html>
