<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem('bc_theme');if(t)document.documentElement.setAttribute('data-theme',t);if(localStorage.getItem('bc_reduce_motion')==='1')document.documentElement.classList.add('reduce-motion');}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crews — BloxCore</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" type="image/png" href="/assets/logo.png">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="brand"><img src="/assets/logo.png" alt="BloxCore" class="brand-logo"><span class="brand-name">Blox<span>Core</span></span></a>
    <button class="nav-toggle" aria-label="Toggle menu">☰</button>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/chat/">Live Chat</a></li>
      <li><a href="/giveaways/">Giveaways</a></li>
      <li><a href="/challenges/">Challenges</a></li>
      <li><a href="/leaderboard/">Leaderboard</a></li>
      <li><a href="/crews/">Crews</a></li>
      <li><a href="/fruit-stock/">Fruit Stock</a></li>
      <li id="nav-auth-slot"></li>
    </ul>
  </div>
</nav>

<section class="section">
  <div class="container">
    <div class="flex-between">
      <h1 style="font-size:1.8rem;">Crews</h1>
      <button class="btn btn-primary" id="create-crew-btn">+ Create Crew</button>
    </div>

    <h2 style="font-size:1.1rem; margin-top:32px;">Team Leaderboard</h2>
    <div id="crew-leaderboard" class="panel" style="margin-top:16px; padding:0;">
      <div class="skeleton" style="height:56px; margin:16px;"></div>
    </div>

    <h2 style="font-size:1.1rem; margin-top:40px;">All Crews</h2>
    <div id="crews-grid" class="grid" style="margin-top:16px;">
      <div class="skeleton" style="height:160px;"></div>
      <div class="skeleton" style="height:160px;"></div>
    </div>
  </div>
</section>

<!-- Create crew modal -->
<div id="crew-modal" style="display:none; position:fixed; inset:0; background:rgba(6,15,26,0.85); z-index:200; align-items:center; justify-content:center; padding:20px; overflow-y:auto;">
  <div class="panel" style="max-width:460px; width:100%; margin:20px 0;">
    <h3 style="font-size:1.1rem;">Create a Crew</h3>
    <form id="crew-form">
      <label for="crew-name">Crew Name</label>
      <input type="text" id="crew-name" required maxlength="40">

      <label for="crew-tag">Tag (optional)</label>
      <input type="text" id="crew-tag" maxlength="6" placeholder="e.g. BXC">

      <label for="crew-description">Description</label>
      <textarea id="crew-description" rows="3" required maxlength="300"></textarea>

      <label for="crew-roblox">Roblox Username (leader's, for members to find you in-game)</label>
      <input type="text" id="crew-roblox" maxlength="40">

      <label for="crew-discord">Discord Server Invite</label>
      <input type="url" id="crew-discord" placeholder="https://discord.gg/yourserver">

      <p class="field-error" id="crew-error" style="display:none;"></p>
      <div style="display:flex; gap:10px;">
        <button type="button" class="btn btn-ghost" id="crew-modal-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary btn-block">Create</button>
      </div>
    </form>
  </div>
</div>

<footer class="site-footer">
  <div class="container">BloxCore is an unofficial fan-made community project for Blox Fruits players.</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/crews.js"></script>
</body>
</html>
