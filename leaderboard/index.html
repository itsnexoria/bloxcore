<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem('bc_theme');if(t)document.documentElement.setAttribute('data-theme',t);if(localStorage.getItem('bc_reduce_motion')==='1')document.documentElement.classList.add('reduce-motion');}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard — BloxCore</title>
<meta name="robots" content="index, follow">
<meta name="description" content="See the top-ranked Blox Fruits players on BloxCore, ranked by level and XP.">
<link rel="canonical" href="https://bloxcore.xyz/leaderboard/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="BloxCore">
<meta property="og:title" content="Leaderboard — BloxCore">
<meta property="og:description" content="See the top-ranked Blox Fruits players on BloxCore, ranked by level and XP.">
<meta property="og:image" content="https://bloxcore.xyz/assets/logo.png">
<meta property="og:url" content="https://bloxcore.xyz/leaderboard/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Leaderboard — BloxCore">
<meta name="twitter:description" content="See the top-ranked Blox Fruits players on BloxCore, ranked by level and XP.">
<meta name="twitter:image" content="https://bloxcore.xyz/assets/logo.png">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" type="image/png" href="/assets/logo.png">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="brand"><img src="/assets/logo.png" alt="BloxCore" class="brand-logo"><span class="brand-name">Blox<span>Core</span></span></a>
    <button type="button" class="nav-toggle" aria-label="Open menu" aria-expanded="false"><i data-lucide="menu" class="icon-md nav-toggle-icon-menu"></i><i data-lucide="x" class="icon-md nav-toggle-icon-close"></i></button>
    <ul class="nav-links">
      <li><a href="/"><i data-lucide="home" class="icon-sm icon-inline"></i>Home</a></li>
      <li><a href="/chat/"><i data-lucide="message-circle" class="icon-sm icon-inline"></i>Live Chat</a></li>
      <li><a href="/giveaways/"><i data-lucide="gift" class="icon-sm icon-inline"></i>Giveaways</a></li>
      <li><a href="/challenges/"><i data-lucide="swords" class="icon-sm icon-inline"></i>Challenges</a></li>
      <li><a href="/leaderboard/"><i data-lucide="trophy" class="icon-sm icon-inline"></i>Leaderboard</a></li>
      <li><a href="/crews/"><i data-lucide="users" class="icon-sm icon-inline"></i>Crews</a></li>
      <li><a href="/trading/"><i data-lucide="repeat" class="icon-sm icon-inline"></i>Trading</a></li>
      <li><a href="/combos/"><i data-lucide="flame" class="icon-sm icon-inline"></i>Combos</a></li>
      <li><a href="/whats-new/"><i data-lucide="sparkles" class="icon-sm icon-inline"></i>What's New</a></li>
      <li id="nav-auth-slot"></li>
    </ul>
  </div>
</nav>

<section class="section">
  <div class="container">
    <h1 style="font-size:1.8rem;">Most Wanted</h1>
    <p class="muted" style="margin-top:-8px;" id="lb-subtitle">Ranked by level, then total XP earned.</p>

    <div style="display:flex; gap:10px; margin:18px 0 10px;">
      <button class="btn btn-primary btn-sm" id="lb-tab-players">Players</button>
      <button class="btn btn-ghost btn-sm" id="lb-tab-crews">Crews</button>
    </div>

    <div style="display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;" id="lb-period-tabs">
      <button class="btn btn-ghost btn-sm" data-period="today">Today</button>
      <button class="btn btn-ghost btn-sm" data-period="weekly">Weekly</button>
      <button class="btn btn-ghost btn-sm" data-period="monthly">Monthly</button>
      <button class="btn btn-primary btn-sm" data-period="alltime">All-Time</button>
    </div>

    <div id="leaderboard-list" class="panel panel-plain" style="padding:0;">
      <div class="skeleton" style="height:60px; margin:16px;"></div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">BloxCore is an unofficial fan-made community project for Blox Fruits players.</div>
</footer>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/leaderboard.js"></script>
</body>
</html>
