# Checks on every push and pull request. Never deploys anything.
#  1. scripts/check-site.mjs  - broken local links/assets, robots/canonical/description rules, JS syntax
#  2. wrangler deploy --dry-run - bundles the real worker.js + wrangler.jsonc (catches missing deps/bad routes)
name: CI

on:
  push:
    branches: [main, master]
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Site smoke checks
        run: node scripts/check-site.mjs .

      - name: Stylesheet bundles
        run: node scripts/check-css-split.mjs .
        continue-on-error: true

      - name: Worker dry-run
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/wrangler-out
