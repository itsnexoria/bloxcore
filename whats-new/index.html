<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem('bc_theme');if(t)document.documentElement.setAttribute('data-theme',t);if(localStorage.getItem('bc_reduce_motion')==='1')document.documentElement.classList.add('reduce-motion');}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What's New — BloxCore</title>
<meta name="robots" content="index, follow">
<meta name="description" content="Everything new on BloxCore — features, fixes, and events.">
<link rel="canonical" href="https://bloxcore.xyz/whats-new/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="BloxCore">
<meta property="og:title" content="What's New — BloxCore">
<meta property="og:description" content="Everything new on BloxCore — features, fixes, and events.">
<meta property="og:image" content="https://bloxcore.xyz/assets/logo.png">
<meta property="og:url" content="https://bloxcore.xyz/whats-new/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="What's New — BloxCore">
<meta name="twitter:description" content="Everything new on BloxCore — features, fixes, and events.">
<meta name="twitter:image" content="https://bloxcore.xyz/assets/logo.png">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" type="image/png" href="/assets/logo.png">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="brand"><img src="/assets/logo.png" alt="BloxCore" class="brand-logo"><span class="brand-name">Blox<span>Core</span></span></a>
    <button type="button" class="nav-toggle" aria-label="Open menu" aria-expanded="false"><i data-lucide="menu" class="icon-md nav-toggle-icon-menu"></i><i data-lucide="x" class="icon-md nav-toggle-icon-close"></i></button>
    <ul class="nav-links">
      <li><a href="/"><i data-lucide="home" class="icon-sm icon-inline"></i>Home</a></li>
      <li><a href="/chat/"><i data-lucide="message-circle" class="icon-sm icon-inline"></i>Live Chat</a></li>
      <li><a href="/giveaways/"><i data-lucide="gift" class="icon-sm icon-inline"></i>Giveaways</a></li>
      <li><a href="/challenges/"><i data-lucide="swords" class="icon-sm icon-inline"></i>Challenges</a></li>
      <li><a href="/leaderboard/"><i data-lucide="trophy" class="icon-sm icon-inline"></i>Leaderboard</a></li>
      <li><a href="/crews/"><i data-lucide="users" class="icon-sm icon-inline"></i>Crews</a></li>
      <li><a href="/trading/"><i data-lucide="repeat" class="icon-sm icon-inline"></i>Trading</a></li>
      <li><a href="/combos/"><i data-lucide="flame" class="icon-sm icon-inline"></i>Combos</a></li>
      <li><a href="/whats-new/" class="active"><i data-lucide="sparkles" class="icon-sm icon-inline"></i>What's New</a></li>
      <li id="nav-auth-slot"></li>
    </ul>
  </div>
</nav>

<section class="section">
  <div class="container" style="max-width:760px;">
    <div class="flex-between">
      <div>
        <h1 style="font-size:1.8rem; margin-bottom:2px;">What's New</h1>
        <p class="muted" style="margin:0;">Features, fixes, and events — newest first.</p>
      </div>
      <button type="button" class="btn btn-primary btn-sm" id="new-entry-btn" style="display:none;"><i data-lucide="plus" class="icon-sm icon-inline"></i>Post Update</button>
    </div>

    <div id="entry-compose" class="panel" style="margin-top:20px; display:none;">
      <form id="entry-form">
        <div class="two-col-grid" style="gap:16px;">
          <div>
            <label for="entry-title">Title</label>
            <input type="text" id="entry-title" placeholder="e.g. New Crew Wars System" maxlength="100" required>
          </div>
          <div>
            <label for="entry-tag">Tag</label>
            <select id="entry-tag">
              <option value="feature">Feature</option>
              <option value="update" selected>Update</option>
              <option value="fix">Fix</option>
              <option value="event">Event</option>
            </select>
          </div>
        </div>
        <label for="entry-description">Description</label>
        <textarea id="entry-description" rows="3" maxlength="600" required></textarea>
        <div style="display:flex; gap:10px;">
          <button type="submit" class="btn btn-primary">Publish</button>
          <button type="button" class="btn btn-ghost" id="entry-cancel-btn">Cancel</button>
        </div>
      </form>
    </div>

    <div id="entry-list" style="margin-top:28px; display:flex; flex-direction:column; gap:16px;">
      <div class="skeleton" style="height:90px;"></div>
      <div class="skeleton" style="height:90px;"></div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">BloxCore is an unofficial fan-made community project for Blox Fruits players.</div>
</footer>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/whats-new.js"></script>
</body>
</html>
