<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem('bc_theme');if(t)document.documentElement.setAttribute('data-theme',t);if(localStorage.getItem('bc_reduce_motion')==='1')document.documentElement.classList.add('reduce-motion');}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crew — BloxCore</title>
<meta name="robots" content="index, follow">
<meta name="description" content="View a Blox Fruits crew's roster, stats, and how to join on BloxCore.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="BloxCore">
<meta property="og:title" content="Crew — BloxCore">
<meta property="og:description" content="View a Blox Fruits crew's roster, stats, and how to join on BloxCore.">
<meta property="og:image" content="https://bloxcore.xyz/assets/logo.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Crew — BloxCore">
<meta name="twitter:description" content="View a Blox Fruits crew's roster, stats, and how to join on BloxCore.">
<meta name="twitter:image" content="https://bloxcore.xyz/assets/logo.png">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" type="image/png" href="/assets/logo.png">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="brand"><img src="/assets/logo.png" alt="BloxCore" class="brand-logo"><span class="brand-name">Blox<span>Core</span></span></a>
    <button class="nav-toggle" aria-label="Toggle menu"><i data-lucide="menu" class="icon-md"></i></button>
    <ul class="nav-links">
      <li><a href="/"><i data-lucide="home" class="icon-sm icon-inline"></i>Home</a></li>
      <li><a href="/chat/"><i data-lucide="message-circle" class="icon-sm icon-inline"></i>Live Chat</a></li>
      <li><a href="/giveaways/"><i data-lucide="gift" class="icon-sm icon-inline"></i>Giveaways</a></li>
      <li><a href="/challenges/"><i data-lucide="swords" class="icon-sm icon-inline"></i>Challenges</a></li>
      <li><a href="/leaderboard/"><i data-lucide="trophy" class="icon-sm icon-inline"></i>Leaderboard</a></li>
      <li><a href="/crews/"><i data-lucide="users" class="icon-sm icon-inline"></i>Crews</a></li>
      <li id="nav-auth-slot"></li>
    </ul>
  </div>
</nav>

<section class="section">
  <div class="container" style="max-width:720px;">
    <p class="muted" style="margin:0 0 12px;"><a href="/crews/" style="color:var(--brass-bright);"><i data-lucide="chevron-left" class="icon-sm"></i> All Crews</a></p>
    <div id="crew-content">
      <div class="skeleton" style="height:160px; margin-bottom:20px;"></div>
      <div class="skeleton" style="height:200px;"></div>
    </div>
  </div>
</section>

<!-- Edit crew modal (leader only) -->
<div id="edit-crew-modal" style="display:none; position:fixed; inset:0; background:rgba(6,15,26,0.85); z-index:200; align-items:center; justify-content:center; padding:20px; overflow-y:auto;">
  <div class="panel" style="max-width:460px; width:100%; margin:20px 0;">
    <h3 style="font-size:1.1rem;">Edit Crew</h3>
    <form id="edit-crew-form">
      <label for="edit-crew-name">Name</label>
      <input type="text" id="edit-crew-name" required maxlength="30">

      <label for="edit-crew-tag">Tag (optional)</label>
      <input type="text" id="edit-crew-tag" maxlength="6" placeholder="e.g. BXC">

      <label for="edit-crew-logo">Logo Image URL (optional)</label>
      <input type="url" id="edit-crew-logo" placeholder="https://…">

      <label for="edit-crew-description">Description</label>
      <textarea id="edit-crew-description" rows="3" required maxlength="400"></textarea>

      <label for="edit-crew-roblox">Roblox Username (optional)</label>
      <input type="text" id="edit-crew-roblox">

      <label for="edit-crew-discord">Discord Invite (optional)</label>
      <input type="url" id="edit-crew-discord" placeholder="https://discord.gg/…">

      <p class="field-error" id="edit-crew-error" style="display:none;"></p>
      <div style="display:flex; gap:10px;">
        <button type="button" class="btn btn-ghost" id="edit-crew-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary btn-block">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<footer class="site-footer">
  <div class="container">BloxCore is an unofficial fan-made community project for Blox Fruits players.</div>
</footer>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/crew.js"></script>
</body>
</html>
