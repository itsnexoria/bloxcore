<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Profile — BloxCore</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" type="image/png" href="/assets/logo.png">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="brand"><img src="/assets/logo.png" alt="BloxCore" class="brand-logo"></a>
    <button class="nav-toggle" aria-label="Toggle menu">☰</button>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/challenges/">Challenges</a></li>
      <li><a href="/leaderboard/">Leaderboard</a></li>
      <li id="nav-auth-slot"></li>
    </ul>
  </div>
</nav>

<section class="section">
  <div class="container" style="max-width:560px;">
    <div class="flex-between" style="margin-bottom:4px;">
      <h1 style="font-size:1.6rem; margin-bottom:0;">Edit Profile</h1>
      <a id="view-public-link" href="#" class="btn btn-ghost btn-sm">View Public Profile</a>
    </div>
    <p class="muted" style="margin-top:0;">This is what other pirates see when they click your name.</p>

    <div class="panel" style="margin-top:20px;">

      <div style="display:flex; align-items:center; gap:18px; margin-bottom:24px;">
        <img id="avatar-preview" src="" alt="" style="width:76px; height:76px; border-radius:50%; object-fit:cover; border:2px solid var(--brass); display:none;">
        <div id="avatar-placeholder" class="stamp" style="width:76px; height:76px; transform:none;"><span style="font-size:1.6rem;">?</span></div>
        <div>
          <label for="avatar-file" class="btn btn-ghost btn-sm" style="cursor:pointer;">Change Avatar</label>
          <input type="file" id="avatar-file" accept="image/*" style="display:none;">
          <p class="muted" style="margin:6px 0 0; font-size:0.78rem;">JPG or PNG, square images look best.</p>
        </div>
      </div>

      <form id="profile-form">
        <label for="bio">Bio</label>
        <textarea id="bio" rows="3" maxlength="300" placeholder="Tell other pirates about yourself…"></textarea>

        <label for="region">Region</label>
        <input type="text" id="region" maxlength="40" placeholder="e.g. NA East, EU, SEA">

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
          <div>
            <label for="pirate_bounty">Pirate Bounty</label>
            <input type="number" id="pirate_bounty" min="0" step="1" placeholder="0">
          </div>
          <div>
            <label for="marine_bounty">Marine Bounty</label>
            <input type="number" id="marine_bounty" min="0" step="1" placeholder="0">
          </div>
        </div>

        <p class="muted" style="font-size:0.78rem; text-transform:uppercase; letter-spacing:0.05em; margin:20px 0 10px;">Social Links</p>
        <label for="social_youtube">YouTube</label>
        <input type="url" id="social_youtube" placeholder="https://youtube.com/@yourname">
        <label for="social_twitch">Twitch</label>
        <input type="url" id="social_twitch" placeholder="https://twitch.tv/yourname">
        <label for="social_twitter">X / Twitter</label>
        <input type="url" id="social_twitter" placeholder="https://x.com/yourname">
        <label for="social_tiktok">TikTok</label>
        <input type="url" id="social_tiktok" placeholder="https://tiktok.com/@yourname">

        <p class="field-error" id="profile-error" style="display:none;"></p>
        <button type="submit" class="btn btn-primary btn-block" id="save-profile-btn">Save Profile</button>
      </form>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">BloxCore is an unofficial fan-made community project for Blox Fruits players.</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/profile-edit.js"></script>
</body>
</html>
