# Checks on every push and pull request. Never deploys anything.
#  1. scripts/check-site.mjs  - broken local links/assets, robots/canonical/description rules, JS syntax
#  1b. scripts/check-deploy.mjs - dev files not leaking, _headers limits, referenced /js /css /assets files exist
#  1c. scripts/csp-hashes.mjs --check - strict CSP hash list matches the site's inline scripts
#  2. wrangler deploy --dry-run - bundles the real worker.js + wrangler.jsonc (catches missing deps/bad routes)
#  3. Lighthouse (lighthouserc.json) on key pages: accessibility + SEO must stay high (fail), performance/CLS/TBT/LCP warn
name: CI

on:
  push:
    branches: [main, master]
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Site smoke checks
        run: node scripts/check-site.mjs .

      - name: Deploy hygiene (public files, headers, referenced assets)
        run: node scripts/check-deploy.mjs .

      - name: CSP inline-script hashes up to date
        run: node scripts/csp-hashes.mjs . --check

      - name: Stylesheet bundles
        run: node scripts/check-css-split.mjs .
        continue-on-error: true

      - name: Worker dry-run
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/wrangler-out

  lighthouse:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Serves the repo as static files and audits the pages listed in lighthouserc.json.
      # Accessibility and SEO scores below the thresholds fail the job; performance only warns.
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14 autorun --config=lighthouserc.json

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore
