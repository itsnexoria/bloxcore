<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — BloxCore</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" type="image/png" href="/assets/logo.png">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="brand"><img src="/assets/logo.png" alt="BloxCore" class="brand-logo"><span class="brand-name">Blox<span>Core</span></span></a>
    <button class="nav-toggle" aria-label="Toggle menu">☰</button>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/chat/">Live Chat</a></li>
      <li><a href="/giveaways/">Giveaways</a></li>
      <li><a href="/challenges/">Challenges</a></li>
      <li><a href="/leaderboard/">Leaderboard</a></li>
      <li id="nav-auth-slot"></li>
    </ul>
  </div>
</nav>

<section class="section">
  <div class="container" style="max-width:420px;">
    <div class="panel">

      <div class="flex-between" style="margin-bottom:20px; border-bottom:1px solid var(--navy-light); padding-bottom:12px;">
        <button id="tab-signin" class="btn btn-ghost btn-sm" style="border-color:var(--brass); color:var(--brass-bright);">Sign In</button>
        <button id="tab-signup" class="btn btn-ghost btn-sm">Create Account</button>
      </div>

      <button id="discord-btn" class="btn btn-primary btn-block" style="margin-bottom:18px; background:#5865F2; box-shadow:0 2px 0 #3d47b3; color:#fff;">
        Continue with Discord
      </button>
      <p class="center muted" style="font-size:0.8rem; margin:-6px 0 18px;">— or use email —</p>

      <form id="signin-form">
        <label for="signin-email">Email</label>
        <input type="email" id="signin-email" required autocomplete="email">
        <label for="signin-password">Password</label>
        <input type="password" id="signin-password" required autocomplete="current-password">
        <p class="field-error" id="signin-error" style="display:none;"></p>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>

      <form id="signup-form" style="display:none;">
        <label for="signup-username">Username</label>
        <input type="text" id="signup-username" required minlength="3" maxlength="24" pattern="[a-zA-Z0-9_]+" title="Letters, numbers, and underscores only">
        <label for="signup-email">Email</label>
        <input type="email" id="signup-email" required autocomplete="email">
        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" required minlength="6" autocomplete="new-password">
        <p class="field-error" id="signup-error" style="display:none;"></p>
        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      </form>

    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
