<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem('bc_theme');if(t)document.documentElement.setAttribute('data-theme',t);if(localStorage.getItem('bc_reduce_motion')==='1')document.documentElement.classList.add('reduce-motion');}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — BloxCore</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Sign in or create a BloxCore account.">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" type="image/png" href="/assets/logo.png">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="brand"><img src="/assets/logo.png" alt="BloxCore" class="brand-logo"><span class="brand-name">Blox<span>Core</span></span></a>
    <button type="button" class="nav-toggle" aria-label="Open menu" aria-expanded="false"><i data-lucide="menu" class="icon-md nav-toggle-icon-menu"></i><i data-lucide="x" class="icon-md nav-toggle-icon-close"></i></button>
    <ul class="nav-links">
      <li><a href="/"><i data-lucide="home" class="icon-sm icon-inline"></i>Home</a></li>
      <li><a href="/chat/"><i data-lucide="message-circle" class="icon-sm icon-inline"></i>Live Chat</a></li>
      <li><a href="/giveaways/"><i data-lucide="gift" class="icon-sm icon-inline"></i>Giveaways</a></li>
      <li><a href="/challenges/"><i data-lucide="swords" class="icon-sm icon-inline"></i>Challenges</a></li>
      <li><a href="/leaderboard/"><i data-lucide="trophy" class="icon-sm icon-inline"></i>Leaderboard</a></li>
      <li><a href="/crews/"><i data-lucide="users" class="icon-sm icon-inline"></i>Crews</a></li>
      <li id="nav-auth-slot"></li>
    </ul>
  </div>
</nav>

<section class="section auth-section">
  <div class="container" style="max-width:440px; position:relative;">
    <div aria-hidden="true" style="position:absolute; inset:-40px; background:radial-gradient(circle, rgb(var(--brass-rgb) / 0.18), transparent 70%); filter:blur(10px); animation: stampPulse 4s ease-in-out infinite; z-index:0;"></div>

    <div class="poster auth-card" style="position:relative; z-index:1;">
      <img src="/assets/logo.png" alt="BloxCore" style="width:64px; height:64px; margin:0 auto 14px; display:block; filter:drop-shadow(0 0 16px rgb(var(--brass-rgb) / 0.5));">
      <p class="poster-eyebrow"><i data-lucide="star" class="icon-sm"></i> Welcome Aboard <i data-lucide="star" class="icon-sm"></i></p>
      <h1 style="font-size:2rem; margin:2px 0 6px; background:linear-gradient(90deg, var(--brass-bright), var(--sea)); -webkit-background-clip:text; background-clip:text; color:transparent;">BloxCore</h1>
      <p class="muted" style="margin:0 0 26px; font-size:0.92rem;">Every legend starts with a name on the board.</p>

      <button id="discord-btn" class="btn btn-primary btn-block" style="background:#5865F2; box-shadow:0 2px 0 #3d47b3; color:#fff; font-size:1rem; padding:14px 22px;">
        Continue with Discord
      </button>
      <p class="muted" style="font-size:0.78rem; margin:16px 0 0;">Sign-in is Discord-only — no separate BloxCore password to manage.</p>
      <p class="field-error" id="signin-error" style="display:none; text-align:left;"></p>

      <div style="margin-top:24px; padding-top:20px; border-top:1px solid var(--navy-light);">
        <p class="muted" style="font-size:0.8rem; margin:0;" id="auth-pirate-count">Pirates are already making their name.</p>
      </div>
    </div>
  </div>
</section>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
