<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem('bc_theme');if(t)document.documentElement.setAttribute('data-theme',t);if(localStorage.getItem('bc_reduce_motion')==='1')document.documentElement.classList.add('reduce-motion');}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — BloxCore</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Sign in or create a BloxCore account.">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" type="image/png" href="/assets/logo.png">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="brand"><img src="/assets/logo.png" alt="BloxCore" class="brand-logo"><span class="brand-name">Blox<span>Core</span></span></a>
    <button class="nav-toggle" aria-label="Toggle menu">☰</button>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/chat/">Live Chat</a></li>
      <li><a href="/giveaways/">Giveaways</a></li>
      <li><a href="/challenges/">Challenges</a></li>
      <li><a href="/leaderboard/">Leaderboard</a></li>
      <li><a href="/crews/">Crews</a></li>
      <li id="nav-auth-slot"></li>
    </ul>
  </div>
</nav>

<section class="section">
  <div class="container" style="max-width:420px;">
    <div class="panel center">
      <p class="muted" style="margin:0 0 4px; font-size:0.85rem;">Welcome to</p>
      <h1 style="font-size:1.4rem; margin-bottom:22px;">BloxCore</h1>

      <button id="discord-btn" class="btn btn-primary btn-block" style="background:#5865F2; box-shadow:0 2px 0 #3d47b3; color:#fff;">
        Continue with Discord
      </button>
      <p class="muted" style="font-size:0.78rem; margin:16px 0 0;">Sign-in is Discord-only — no separate BloxCore password to manage.</p>
      <p class="field-error" id="signin-error" style="display:none; text-align:left;"></p>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
