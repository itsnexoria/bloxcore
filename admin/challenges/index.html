<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Challenges — BloxCore Admin</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" type="image/png" href="/assets/logo.png">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="brand"><img src="/assets/logo.png" alt="BloxCore" class="brand-logo"><span class="admin-badge">Admin</span></a>
    <button class="nav-toggle" aria-label="Toggle menu">☰</button>
    <ul class="nav-links">
      <li><a href="/admin/">Review Board</a></li>
      <li><a href="/admin/challenges/">Manage Challenges</a></li>
      <li><a href="/">View Site</a></li>
      <li id="nav-auth-slot"></li>
    </ul>
  </div>
</nav>

<section class="section">
  <div class="container">
    <div class="flex-between">
      <div>
        <h1 style="font-size:1.8rem; margin-bottom:2px;">Manage Challenges</h1>
        <p class="muted" style="margin:0;"><a href="/admin/" style="color:var(--brass-bright);">← Back to Review Board</a></p>
      </div>
      <button class="btn btn-primary" id="new-challenge-btn">+ New Challenge</button>
    </div>

    <div class="panel" style="margin-top:24px;">
      <div class="flex-between" style="flex-wrap:wrap; gap:16px;">
        <div>
          <h3 style="font-size:1rem; margin-bottom:4px;">Rotation Pools</h3>
          <p class="muted" style="margin:0; font-size:0.85rem;">Runs automatically on schedule — trigger early any time.</p>
        </div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button class="btn btn-ghost btn-sm" data-rotate="daily">Rotate Daily Now</button>
          <button class="btn btn-ghost btn-sm" data-rotate="weekly">Rotate Weekly Now</button>
          <button class="btn btn-ghost btn-sm" data-rotate="monthly">Rotate Monthly Now</button>
        </div>
      </div>
    </div>

    <div id="challenges-table" style="margin-top:28px;">
      <div class="skeleton" style="height:60px; margin-bottom:10px;"></div>
      <div class="skeleton" style="height:60px; margin-bottom:10px;"></div>
      <div class="skeleton" style="height:60px;"></div>
    </div>
  </div>
</section>

<!-- Create / edit challenge modal -->
<div id="challenge-modal" style="display:none; position:fixed; inset:0; background:rgba(6,15,26,0.85); z-index:200; align-items:center; justify-content:center; padding:20px; overflow-y:auto;">
  <div class="panel" style="max-width:460px; width:100%; margin:20px 0;">
    <h3 id="modal-title" style="font-size:1.1rem;">New Challenge</h3>
    <form id="challenge-form">
      <input type="hidden" id="challenge-id">

      <label for="title">Title</label>
      <input type="text" id="title" required maxlength="80">

      <label for="description">Description</label>
      <textarea id="description" rows="3" required maxlength="300"></textarea>

      <label for="difficulty">Difficulty</label>
      <select id="difficulty" required>
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
        <option value="legendary">Legendary</option>
      </select>

      <label for="xp_reward">XP Reward</label>
      <input type="number" id="xp_reward" min="1" max="1000" required>

      <label for="rotation">Rotation</label>
      <select id="rotation">
        <option value="none">None — always visible</option>
        <option value="daily">Daily pool</option>
        <option value="weekly">Weekly pool</option>
        <option value="monthly">Monthly pool</option>
      </select>

      <label style="display:flex; align-items:center; gap:8px; text-transform:none; font-weight:600; margin-bottom:16px;">
        <input type="checkbox" id="active" style="width:auto; margin:0;" checked>
        Active (visible to players)
      </label>

      <p class="field-error" id="challenge-error" style="display:none;"></p>
      <div style="display:flex; gap:10px;">
        <button type="button" class="btn btn-ghost" id="modal-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary btn-block" id="save-btn">Save Challenge</button>
      </div>
    </form>
  </div>
</div>

<footer class="site-footer">
  <div class="container">BloxCore admin panel — visible only to reviewers.</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/admin-challenges.js"></script>
</body>
</html>
