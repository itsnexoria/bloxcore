<script>(function(){try{var a=localStorage.getItem('bc_accent');if(a==='custom'){var c=JSON.parse(localStorage.getItem('bc_custom_theme')||'null');if(c){var s=document.documentElement.style;s.setProperty('--ink',c.ink);s.setProperty('--navy',c.navy);s.setProperty('--navy-light',c['navy-light']);s.setProperty('--brass',c.brass);s.setProperty('--brass-bright',c['brass-bright']);s.setProperty('--ink-glow',c.navy);var h=c.brass.replace('#','');s.setProperty('--brass-rgb',parseInt(h.substring(0,2),16)+' '+parseInt(h.substring(2,4),16)+' '+parseInt(h.substring(4,6),16));document.documentElement.setAttribute('data-accent','custom');}}else if(a){document.documentElement.setAttribute('data-accent',a);}if(localStorage.getItem('bc_reduce_motion')==='1')document.documentElement.classList.add('reduce-motion');if(localStorage.getItem('bc_compact_mode')==='1')document.documentElement.classList.add('compact-mode');}catch(e){}})();</script>

<section class="section">
  <div class="container" style="max-width:820px;">
    <p class="muted" style="margin:0 0 10px;"><a href="/admin/overview/" style="color:var(--brass-bright);"><i data-lucide="chevron-left" class="icon-sm"></i> Back to Overview</a></p>
    <h1 style="font-size:1.8rem; margin-bottom:2px;">Update Guides</h1>
    <p class="muted" style="margin:0 0 16px;">Publish a page for a Blox Fruits update. Today's fruit values are frozen into an S/A/B/C tier list when you publish.</p>
    <div id="upd-admin-content" style="display:none;">
      <form id="upd-form" class="panel" style="padding:16px; display:grid; gap:10px;">
        <div class="clip-form-grid">
          <div><label for="upd-name">Update name</label><input type="text" id="upd-name" placeholder="e.g. Update 28" required minlength="2" maxlength="80"></div>
          <div><label for="upd-slug">URL slug</label><input type="text" id="upd-slug" placeholder="update-28" required pattern="[a-z0-9-]{3,60}" maxlength="60"></div>
        </div>
        <div class="clip-form-grid">
          <div><label for="upd-date">Release date</label><input type="date" id="upd-date" required></div>
          <div><label for="upd-summary">One-line summary</label><input type="text" id="upd-summary" maxlength="300" placeholder="New island, fruit reworks…"></div>
        </div>
        <div><label for="upd-notes">What changed <span class="muted" style="font-weight:400; text-transform:none; font-size:0.78rem;">— markdown supported</span></label><textarea id="upd-notes" rows="7" maxlength="8000" placeholder="## Highlights&#10;- …"></textarea></div>
        <div><button type="submit" class="btn btn-primary" id="upd-submit">Publish + snapshot tier list</button></div>
      </form>
      <h2 style="font-size:1.1rem; margin:26px 0 10px;">Published</h2>
      <div id="upd-admin-list" style="display:grid; gap:8px;"></div>
    </div>
  </div>
