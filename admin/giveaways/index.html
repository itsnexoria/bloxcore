<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem('bc_theme');if(t)document.documentElement.setAttribute('data-theme',t);if(localStorage.getItem('bc_reduce_motion')==='1')document.documentElement.classList.add('reduce-motion');}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Giveaways — BloxCore Admin</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="BloxCore giveaway management.">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" type="image/png" href="/assets/logo.png">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="brand"><img src="/assets/logo.png" alt="BloxCore" class="brand-logo"><span class="brand-name">Blox<span>Core</span></span><span class="admin-badge" id="role-badge">Staff</span></a>
    <button class="nav-toggle" aria-label="Toggle menu">☰</button>
    <ul class="nav-links">
      <li><a href="/admin/">Admin</a></li>
      <li data-requires-role="admin"><a href="/admin/challenges/">Manage Challenges</a></li>
      <li><a href="/admin/giveaways/">Manage Giveaways</a></li>
      <li data-requires-role="admin"><a href="/admin/users/">Manage Users</a></li>
      <li data-requires-role="admin"><a href="/admin/titles/">Manage Titles</a></li>
      <li><a href="/">View Site</a></li>
      <li id="nav-auth-slot"></li>
    </ul>
  </div>
</nav>

<section class="section">
  <div class="container">
    <div class="flex-between">
      <div>
        <h1 style="font-size:1.8rem; margin-bottom:2px;">Manage Giveaways</h1>
        <p class="muted" style="margin:0;"><a href="/admin/" style="color:var(--brass-bright);">← Back to Admin</a></p>
      </div>
      <button class="btn btn-primary" id="new-giveaway-btn">+ New Giveaway</button>
    </div>

    <div id="giveaways-table" style="margin-top:28px;">
      <div class="skeleton" style="height:80px; margin-bottom:10px;"></div>
      <div class="skeleton" style="height:80px;"></div>
    </div>
  </div>
</section>

<!-- Create giveaway modal -->
<div id="giveaway-modal" style="display:none; position:fixed; inset:0; background:rgba(6,15,26,0.85); z-index:200; align-items:center; justify-content:center; padding:20px; overflow-y:auto;">
  <div class="panel" style="max-width:460px; width:100%; margin:20px 0;">
    <h3 style="font-size:1.1rem;">New Giveaway</h3>
    <form id="giveaway-form">
      <label for="gv-title">Title</label>
      <input type="text" id="gv-title" required maxlength="80">

      <label for="gv-prize">Prize</label>
      <input type="text" id="gv-prize" required maxlength="120" placeholder="e.g. 500 Robux, Rare Fruit Bundle">

      <label for="gv-description">Description</label>
      <textarea id="gv-description" rows="3" required maxlength="400"></textarea>

      <label for="gv-ends">Ends At</label>
      <input type="datetime-local" id="gv-ends" required>

      <label for="gv-icon-category">Prize Icon (optional)</label>
      <div style="display:flex; gap:10px; align-items:center;">
        <select id="gv-icon-category" style="flex:1;">
          <option value="">— None —</option>
          <option value="fruit">Fruit</option>
          <option value="sword">Sword</option>
          <option value="gun">Gun</option>
          <option value="melee">Fighting Style</option>
          <option value="race">Race</option>
          <option value="accessory">Accessory</option>
        </select>
        <select id="gv-icon-item" style="flex:1;" disabled></select>
        <img id="gv-icon-preview" style="display:none; width:36px; height:36px; object-fit:contain;" alt="">
      </div>

      <p class="field-error" id="giveaway-error" style="display:none;"></p>
      <div style="display:flex; gap:10px;">
        <button type="button" class="btn btn-ghost" id="giveaway-modal-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary btn-block">Create Giveaway</button>
      </div>
    </form>
  </div>
</div>

<footer class="site-footer">
  <div class="container">BloxCore admin panel — visible only to reviewers.</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/build-options.js"></script>
<script src="/js/admin-giveaways.js"></script>
</body>
</html>
