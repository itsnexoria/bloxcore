<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem('bc_theme');if(t)document.documentElement.setAttribute('data-theme',t);if(localStorage.getItem('bc_reduce_motion')==='1')document.documentElement.classList.add('reduce-motion');}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Users — BloxCore Admin</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="BloxCore user management.">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" type="image/png" href="/assets/logo.png">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="brand"><img src="/assets/logo.png" alt="BloxCore" class="brand-logo"><span class="brand-name">Blox<span>Core</span></span><span class="admin-badge" id="role-badge">Staff</span></a>
    <button type="button" class="nav-toggle" aria-label="Open menu" aria-expanded="false"><i data-lucide="menu" class="icon-md nav-toggle-icon-menu"></i><i data-lucide="x" class="icon-md nav-toggle-icon-close"></i></button>
    <ul class="nav-links">
      <li><a href="/admin/"><i data-lucide="shield" class="icon-sm icon-inline"></i>Admin</a></li>
      <li data-requires-role="admin"><a href="/admin/challenges/"><i data-lucide="swords" class="icon-sm icon-inline"></i>Manage Challenges</a></li>
      <li><a href="/admin/giveaways/"><i data-lucide="gift" class="icon-sm icon-inline"></i>Manage Giveaways</a></li>
      <li data-requires-role="admin"><a href="/admin/users/"><i data-lucide="users" class="icon-sm icon-inline"></i>Manage Users</a></li>
      <li data-requires-role="admin"><a href="/admin/titles/"><i data-lucide="tag" class="icon-sm icon-inline"></i>Manage Titles</a></li>
      <li><a href="/"><i data-lucide="external-link" class="icon-sm icon-inline"></i>View Site</a></li>
      <li id="nav-auth-slot"></li>
    </ul>
  </div>
</nav>

<section class="section">
  <div class="container">
    <div>
      <h1 style="font-size:1.8rem; margin-bottom:2px;">Manage Users</h1>
      <p class="muted" style="margin:0;"><a href="/admin/" style="color:var(--brass-bright);"><i data-lucide="chevron-left" class="icon-sm"></i> Back to Admin</a></p>
    </div>

    <input type="text" id="user-search" placeholder="Search by username or display name…" style="margin-top:20px; max-width:360px;">

    <h2 style="font-size:1.1rem; margin-top:36px;">User Activity</h2>
    <div id="crm-stats" class="grid" style="margin-top:12px;">
      <div class="skeleton" style="height:70px;"></div>
      <div class="skeleton" style="height:70px;"></div>
      <div class="skeleton" style="height:70px;"></div>
      <div class="skeleton" style="height:70px;"></div>
    </div>

    <div style="display:flex; gap:10px; margin-top:18px;">
      <button class="btn btn-primary btn-sm" data-crm-filter="all">All</button>
      <button class="btn btn-ghost btn-sm" data-crm-filter="online">Online</button>
      <button class="btn btn-ghost btn-sm" data-crm-filter="idle">Idle</button>
      <button class="btn btn-ghost btn-sm" data-crm-filter="offline">Offline</button>
    </div>
    <div id="active-users" style="margin-top:12px;">
      <div class="skeleton" style="height:50px;"></div>
    </div>

    <h2 style="font-size:1.1rem; margin-top:36px;">All Users</h2>
    <div id="user-bulk-bar" class="panel panel-plain" style="margin-top:12px; padding:12px 20px; display:none; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
      <label style="display:flex; align-items:center; gap:8px; text-transform:none; font-weight:600; margin:0;">
        <input type="checkbox" id="user-select-all" style="width:auto; margin:0;">
        <span id="user-select-count">0 selected</span>
      </label>
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
        <input type="number" id="bulk-xp-input" placeholder="+/- XP" style="width:110px; margin:0;">
        <button class="btn btn-ghost btn-sm" id="bulk-xp-btn">Adjust XP</button>
        <button class="btn btn-danger btn-sm" id="bulk-ban-btn">Ban Selected</button>
        <button class="btn btn-ghost btn-sm" id="bulk-unban-btn">Unban Selected</button>
      </div>
    </div>
    <div id="users-table" style="margin-top:16px;">
      <div class="skeleton" style="height:60px; margin-bottom:10px;"></div>
      <div class="skeleton" style="height:60px; margin-bottom:10px;"></div>
      <div class="skeleton" style="height:60px;"></div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">BloxCore admin panel — visible only to reviewers.</div>
</footer>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/admin-users.js"></script>
</body>
</html>
