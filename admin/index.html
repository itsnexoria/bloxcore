<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem('bc_theme');if(t)document.documentElement.setAttribute('data-theme',t);if(localStorage.getItem('bc_reduce_motion')==='1')document.documentElement.classList.add('reduce-motion');}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review Board — BloxCore Admin</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="BloxCore staff review board.">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" type="image/png" href="/assets/logo.png">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="brand"><img src="/assets/logo.png" alt="BloxCore" class="brand-logo"><span class="brand-name">Blox<span>Core</span></span><span class="admin-badge" id="role-badge">Staff</span></a>
    <button class="nav-toggle" aria-label="Toggle menu"><i data-lucide="menu" class="icon-md"></i></button>
    <ul class="nav-links">
      <li><a href="/admin/">Admin</a></li>
      <li data-requires-role="admin"><a href="/admin/challenges/">Manage Challenges</a></li>
      <li><a href="/admin/giveaways/">Manage Giveaways</a></li>
      <li data-requires-role="admin"><a href="/admin/users/">Manage Users</a></li>
      <li data-requires-role="admin"><a href="/admin/titles/">Manage Titles</a></li>
      <li><a href="/">View Site</a></li>
      <li id="nav-auth-slot"></li>
    </ul>
  </div>
</nav>

<section class="section">
  <div class="container">
    <div class="flex-between">
      <div>
        <h1 style="font-size:1.8rem; margin-bottom:2px;">Review Board</h1>
        <p class="muted" style="margin:0;">Pending bounty submissions awaiting a stamp.</p>
      </div>
      <a href="/admin/challenges/" class="btn btn-ghost">Manage Challenges</a>
    </div>

    <div id="bulk-bar" class="panel panel-plain" style="margin-top:20px; padding:12px 20px; display:none; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
      <label style="display:flex; align-items:center; gap:8px; text-transform:none; font-weight:600; margin:0;">
        <input type="checkbox" id="select-all" style="width:auto; margin:0;">
        <span id="select-count">0 selected</span>
      </label>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-primary btn-sm" id="bulk-approve-btn">Approve Selected</button>
        <button class="btn btn-danger btn-sm" id="bulk-reject-btn">Reject Selected</button>
      </div>
    </div>

    <div id="pending-list" class="grid" style="margin-top:16px;">
      <div class="skeleton" style="height:260px;"></div>
    </div>
  </div>
</section>

<!-- Screenshot lightbox -->
<div id="lightbox" class="lightbox-overlay">
  <button type="button" class="btn btn-ghost btn-sm" id="lightbox-close" style="position:absolute; top:18px; right:18px;"><i data-lucide="x" class="icon-md"></i> Close</button>
  <button type="button" class="lightbox-nav lightbox-prev" id="lightbox-prev"><i data-lucide="chevron-left" class="icon-md"></i></button>
  <img id="lightbox-img" src="" alt="Submission proof — full size">
  <button type="button" class="lightbox-nav lightbox-next" id="lightbox-next"><i data-lucide="chevron-right" class="icon-md"></i></button>
  <p class="muted" id="lightbox-count" style="position:absolute; bottom:18px; left:50%; transform:translateX(-50%);"></p>
</div>

<footer class="site-footer">
  <div class="container">BloxCore admin panel — visible only to reviewers.</div>
</footer>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
