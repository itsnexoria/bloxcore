<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Bounty — BloxCore</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="brand"><span class="brand-mark">⚓</span> BloxCore</a>
    <button class="nav-toggle" aria-label="Toggle menu">☰</button>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/challenges/">Challenges</a></li>
      <li><a href="/leaderboard/">Leaderboard</a></li>
      <li><a href="/dashboard/">Dashboard</a></li>
      <li id="nav-auth-slot" style="display:flex; gap:20px; align-items:center;"></li>
    </ul>
  </div>
</nav>

<section class="section">
  <div class="container">

    <div id="profile-card" class="panel" style="display:flex; gap:28px; align-items:center; flex-wrap:wrap;">
      <div class="skeleton" style="width:92px; height:92px; border-radius:50%;"></div>
      <div style="flex:1; min-width:220px;">
        <div class="skeleton" style="width:180px; height:24px; margin-bottom:10px;"></div>
        <div class="skeleton" style="width:100%; height:10px;"></div>
      </div>
    </div>

    <div style="margin-top:40px;">
      <h2 style="font-size:1.3rem;">Your Submissions</h2>
      <div id="submissions-list" class="grid" style="margin-top:20px;">
        <div class="skeleton" style="height:140px;"></div>
      </div>
    </div>

  </div>
</section>

<footer class="site-footer">
  <div class="container">BloxCore is an unofficial fan-made community project for Blox Fruits players.</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
